<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --primary: #6366f1;
  --secondary: #22c55e;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --watch-bg: linear-gradient(135deg,#6366f1,#22c55e);
  --scroll-bg: rgba(99,102,241,0.2);
  --scroll-thumb: linear-gradient(180deg,#6366f1,#22c55e);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Poppins',sans-serif;background:radial-gradient(circle at top,#1e293b,var(--bg));color:var(--text);}
header{padding:20px 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
.logo{font-size:28px;font-weight:700;color:var(--primary);letter-spacing:1px;margin-bottom:10px;}
nav, .genres-filter{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
nav button, .genres-filter button{background:var(--card);border:none;color:var(--muted);padding:8px 20px;border-radius:999px;font-size:14px;cursor:pointer;transition:0.3s,transform 0.3s;}
nav button.active, nav button:hover, .genres-filter button.active, .genres-filter button:hover{color:var(--text);background:var(--primary);transform:scale(1.05);}
#toggleGenres{background:var(--secondary);color:white;padding:8px 16px;border-radius:12px;cursor:pointer;transition:0.3s;}
#toggleGenres:hover{opacity:0.85;transform:scale(1.05);}
.container{padding:20px 40px 40px;}
.section-title{font-size:22px;font-weight:600;margin:20px 0;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px;}
.card{background:var(--card);border-radius:18px;overflow:hidden;transition:transform .4s,box-shadow .4s;cursor:pointer;}
.card:hover{transform:translateY(-8px) scale(1.03);box-shadow:0 20px 40px rgba(99,102,241,0.25);}
.poster{width:100%;height:280px;object-fit:cover;}
.info{padding:14px;}
.title{font-size:15px;font-weight:600;margin-bottom:6px;}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);}
.badge{background:rgba(99,102,241,0.15);color:var(--primary);padding:4px 10px;border-radius:999px;font-size:12px;}/* Modal */ #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);align-items:center;justify-content:center;z-index:100;transition:opacity 0.3s;opacity:0;} #modal.show{display:flex;opacity:1;} #modalContent{ background:#020617; width:90%; max-width:900px; max-height:90vh; border-radius:20px; overflow:hidden; display:grid; grid-template-columns:1fr 1fr; } #modalContent img{ width:100%; height:100%; object-fit:cover; } #modalContent > div{padding:28px;overflow:visible;} #modalContent h2{font-size:26px;margin-bottom:10px;} #modalContent p{color:#e5e7eb;line-height:1.6;} #modalContent span{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(99,102,241,.15);color:#6366f1;margin-bottom:10px;} #modalContent #modalGenres{margin-top:10px;color:#9ca3af;font-size:14px;} #watchButton{ display:inline-block; margin-top:20px; background:var(--watch-bg); padding:12px 28px; border-radius:999px; color:white; text-decoration:none; font-weight:700; font-size:15px; transition:0.3s; box-shadow:0 6px 15px rgba(0,0,0,0.3); } #watchButton:hover{transform:scale(1.05);box-shadow:0 8px 20px rgba(0,0,0,0.5);} #modalContent button{margin-top:12px;background:linear-gradient(135deg,#6366f1,#22c55e);border:none;padding:10px 26px;border-radius:999px;color:white;cursor:pointer;transition:0.3s;font-weight:600;} #modalContent button:hover{opacity:0.9;}

/* Scroll داخلي للوصف */ #modalDesc{ max-height: 220px; overflow-y: auto; padding-right: 6px; scrollbar-width: thin; scrollbar-color: var(--primary) transparent; } #modalDesc::-webkit-scrollbar{width:6px;} #modalDesc::-webkit-scrollbar-thumb{background: var(--scroll-thumb); border-radius:10px;} #modalDesc::-webkit-scrollbar-track{background: var(--scroll-bg);}

/* Scroll ناعم */ html {scroll-behavior: smooth;}

/* Footer */ .site-footer { background-color: #050f28; color: #f0f0f0; text-align: center; padding: 12px 0; margin-top: 30px; border-top-left-radius: 25px; border-top-right-radius: 25px; } .footer-content {max-width:900px;margin:auto;} .footer-links {list-style:none;padding:0;margin:8px 0 0;display:flex;justify-content:center;gap:18px;} .footer-links a {color:#ffcc00;text-decoration:none;font-weight:bold;} .footer-links a:hover {color:#ffd633;text-decoration:underline;} .site-footer p {font-size:14px;color:#ccc;margin:8px 0 0;}

/* Ratings */ .rating {display:flex;align-items:center;gap:4px;margin:6px 0;} .rating span {font-size:15px;color:#374151;} .rating .filled {color:#fbbf24;text-shadow:0 0 6px rgba(251,191,36,0.6);} .rating-number {font-size:13px;color:#9ca3af;margin-left:6px;}

/* Responsive */ @media(max-width:600px){ header{padding:20px;} .container{padding:0 20px 30px;} .card .poster{height:220px;} #modalContent{grid-template-columns:1fr;max-height:95vh;} #modalContent img{height:220px;} .rating span{font-size:18px;} .rating-number{font-size:14px;} }

  color: #1e293b;/* لون النص (اختياري حسب الخلفية) */
  padding: 10px ;
}


  

</style>

// Generate Genre Buttons
let allGenres = [];
items.forEach(item => { allGenres.push(...item.genres); });
allGenres = [...new Set(allGenres)];
allGenres.forEach(genre => {
  const btn = document.createElement('button');
  btn.textContent = genre;
  btn.onclick = () => filterGenre(genre, btn);
  genresContainer.appendChild(btn);
});

function render(){
  grid.innerHTML='';
  items.filter(item => (currentFilter==='all'||item.type===currentFilter) &&
                       (currentGenre==='all'||item.genres.includes(currentGenre)))
       .forEach(item => {
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML=`<img class="poster" src="${item.image}"/><div class="info">
<div class="title">${item.title}</div>${generateStars(item.rating || 0)}
<div class="meta"><span>${item.year}</span><span class="badge">${item.type}</span></div></div>`;
    card.onclick = () => openModal(item);
    grid.appendChild(card);
  });
}

function filter(type,btn){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = type;
  render();
}

function filterGenre(genre, btn){
  document.querySelectorAll('.genres-filter button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentGenre = genre;
  render();
}

toggleGenresBtn.onclick = () => {
  if(genresContainer.style.display === 'none'){
    genresContainer.style.display = 'flex';
    toggleGenresBtn.textContent = 'Hide Genres';
  } else {
    genresContainer.style.display = 'none';
    toggleGenresBtn.textContent = 'Show Genres';
  }
};

function openModal(item){
  modal.classList.add('show');
  modalImage.src = item.image;
  modalTitle.textContent = item.title;
  modalYear.textContent = item.year;
  modalType.textContent = item.type;
  modalDesc.textContent = item.description;
  modalGenres.textContent = item.genres ? "Genres: " + item.genres.join(", ") : "";
  watchButton.style.display = item.watchLink ? 'inline-block':'none';
  watchButton.href = item.watchLink || '#';
  modalRating.innerHTML = generateStars(item.rating || 0);
}

function closeModal(){ modal.classList.remove('show'); }

modal.addEventListener("click", e => { if(e.target === modal) closeModal(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

function generateStars(rate){
  let stars = '';
  for(let i=1;i<=5;i++){
    stars += i <= Math.floor(rate) ? '<span class="filled">★</span>' : '<span>★</span>';
  }
  return `<div class="rating">${stars}<span class="rating-number">${rate}</span></div>`;
}
